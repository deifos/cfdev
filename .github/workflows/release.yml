name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag is released from main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check installer and package scripts
        run: |
          bash -n scripts/install.sh
          bash -n scripts/render-packages.sh

  build-portable:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: cfdev-linux-amd64
          - goos: linux
            goarch: arm64
            output: cfdev-linux-arm64
          - goos: windows
            goarch: amd64
            output: cfdev-windows-amd64.exe
          - goos: windows
            goarch: arm64
            output: cfdev-windows-arm64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          go build -trimpath -ldflags="-s -w -X github.com/deifos/cfdev/internal/app.Version=${version}" -o "dist/${{ matrix.output }}" ./cmd/cfdev
      - name: Attest binary
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/${{ matrix.output }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error

  build-macos:
    needs: verify
    environment: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goarch: amd64
            output: cfdev-darwin-amd64
          - runner: macos-15
            goarch: arm64
            output: cfdev-darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/cfdev-signing.p12"
          keychain_path="$RUNNER_TEMP/cfdev-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity=$(security find-identity -v -p codesigning "$keychain_path" | awk '/Developer ID Application/ { print $2; exit }')
          test -n "$signing_identity"
          echo "CFDEV_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "CFDEV_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
      - name: Build and sign darwin/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi

          go build -trimpath -ldflags="-s -w -X github.com/deifos/cfdev/internal/app.Version=${version}" -o "dist/${{ matrix.output }}" ./cmd/cfdev
          codesign \
            --force \
            --keychain "$CFDEV_KEYCHAIN_PATH" \
            --options runtime \
            --sign "$CFDEV_SIGNING_IDENTITY" \
            --timestamp \
            "dist/${{ matrix.output }}"
          codesign --verify --strict --verbose=2 "dist/${{ matrix.output }}"
          "dist/${{ matrix.output }}" --version
      - name: Notarize darwin/${{ matrix.goarch }}
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          archive_path="$RUNNER_TEMP/${{ matrix.output }}.zip"
          result_path="$RUNNER_TEMP/notary-result.json"

          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"
          ditto -c -k --keepParent "dist/${{ matrix.output }}" "$archive_path"

          set +e
          xcrun notarytool submit "$archive_path" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --output-format json \
            --timeout 30m \
            --wait > "$result_path"
          notary_exit=$?
          set -e

          cat "$result_path"
          submission_id=$(plutil -extract id raw -o - "$result_path" 2>/dev/null || true)
          notary_status=$(plutil -extract status raw -o - "$result_path" 2>/dev/null || true)
          if [ "$notary_exit" -ne 0 ] || [ "$notary_status" != "Accepted" ]; then
            if [ -n "$submission_id" ]; then
              xcrun notarytool log "$submission_id" \
                --issuer "$APPLE_API_ISSUER_ID" \
                --key "$api_key_path" \
                --key-id "$APPLE_API_KEY_ID" || true
            fi
            exit 1
          fi

          # Bare Mach-O command-line tools are not app bundles, so spctl reports
          # "does not seem to be an app" even after successful notarization.
          codesign --verify --strict --verbose=2 "dist/${{ matrix.output }}"
      - name: Attest signed binary
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/${{ matrix.output }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -n "${CFDEV_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$CFDEV_KEYCHAIN_PATH" || true
          fi
          rm -f \
            "$RUNNER_TEMP/cfdev-signing.p12" \
            "$RUNNER_TEMP/AuthKey_"*.p8 \
            "$RUNNER_TEMP/"cfdev-darwin-*.zip

  publish:
    if: github.event_name == 'push'
    needs: [build-portable, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums and package definitions
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum cfdev-* > checksums.txt
          cd ..
          bash scripts/render-packages.sh "${VERSION#v}" dist/checksums.txt dist/packages
          cd dist/packages
          zip -r ../winget-manifests.zip winget
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/cfdev-* \
            dist/checksums.txt \
            dist/packages/cfdev.rb \
            dist/packages/cfdev.json \
            dist/winget-manifests.zip \
            scripts/install.ps1 \
            scripts/install.sh \
            --verify-tag \
            --generate-notes \
            --title "cfdev ${GITHUB_REF_NAME}"
