name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Check shell installers and package rendering
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n scripts/install.sh
          bash -n scripts/render-packages.sh
          checksum=$(sha256sum README.md | awk '{print $1}')
          for name in cfdev-windows-amd64.exe cfdev-windows-arm64.exe cfdev-darwin-amd64 cfdev-darwin-arm64 cfdev-linux-amd64 cfdev-linux-arm64; do
            echo "$checksum  $name"
          done > "$RUNNER_TEMP/checksums.txt"
          bash scripts/render-packages.sh 0.1.0 "$RUNNER_TEMP/checksums.txt" "$RUNNER_TEMP/packages"
          test -z "$(grep -R '@[A-Z_]*@' "$RUNNER_TEMP/packages" || true)"
          python3 -m json.tool "$RUNNER_TEMP/packages/cfdev.json" >/dev/null
          ruby -c "$RUNNER_TEMP/packages/cfdev.rb"
      - name: Check PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: cfdev-linux-amd64
          - goos: linux
            goarch: arm64
            output: cfdev-linux-arm64
          - goos: darwin
            goarch: amd64
            output: cfdev-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: cfdev-darwin-arm64
          - goos: windows
            goarch: amd64
            output: cfdev-windows-amd64.exe
          - goos: windows
            goarch: arm64
            output: cfdev-windows-arm64.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w -X github.com/deifos/cfdev/internal/app.Version=0.3.1-dev" -o "dist/${{ matrix.output }}" ./cmd/cfdev
