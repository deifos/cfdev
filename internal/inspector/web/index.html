<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cfdev inspector</title>
  <style>
    :root{color-scheme:dark;--bg:#080c16;--panel:#101726;--panel2:#151e30;--line:#263249;--text:#edf2fa;--muted:#8f9db5;--green:#69e3aa;--blue:#72a7ff;--red:#ff7b87;--amber:#ffc66d;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;height:100vh;overflow:hidden}button,input{font:inherit}.shell{height:100vh;display:grid;grid-template-rows:auto 1fr}.top{min-height:68px;display:flex;align-items:center;gap:18px;padding:12px 20px;border-bottom:1px solid var(--line);background:#0b111e}.brand{font-size:19px;font-weight:750;letter-spacing:-.03em}.brand i{font-style:normal;color:var(--green)}.status{display:flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px #69e3aa88}.dot.down{background:var(--red);box-shadow:none}.search{flex:1;max-width:520px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 12px;outline:none}.search:focus{border-color:#4f6b9d}.capture{display:flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer;white-space:nowrap}.capture input{accent-color:var(--green)}.ghost,.primary{border:1px solid var(--line);border-radius:8px;padding:8px 11px;color:var(--text);background:var(--panel);cursor:pointer}.ghost:hover{background:var(--panel2)}.primary{background:#2b8b67;border-color:#35a77e}.primary:disabled,.ghost:disabled{opacity:.45;cursor:not-allowed}.main{min-height:0;display:grid;grid-template-columns:minmax(350px,42%) 1fr}.list{overflow:auto;border-right:1px solid var(--line);background:#0c121f}.limits{position:sticky;top:0;z-index:2;padding:9px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;background:#0c121fee;backdrop-filter:blur(8px)}.row{display:grid;grid-template-columns:64px minmax(0,1fr) 52px 68px;gap:10px;align-items:center;padding:13px 14px;border-bottom:1px solid #1d2638;cursor:pointer}.row:hover,.row.active{background:var(--panel2)}.method{font:700 12px var(--mono);color:var(--blue)}.method.POST{color:var(--green)}.method.DELETE{color:var(--red)}.method.PUT,.method.PATCH{color:var(--amber)}.path{min-width:0}.path strong,.path small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.path strong{font:13px var(--mono)}.path small{margin-top:4px;color:var(--muted)}.code{font:700 12px var(--mono);color:var(--green)}.code.bad{color:var(--red)}.time{text-align:right;color:var(--muted);font:12px var(--mono)}.detail{overflow:auto;padding:22px 24px 60px}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}.empty h2{color:var(--text);margin:0 0 8px}.detail-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px}.detail-head h1{font:600 19px var(--mono);margin:1px 0 5px;word-break:break-all}.detail-head p{margin:0;color:var(--muted)}.actions{margin-left:auto;display:flex;gap:8px}.banner{padding:11px 13px;border:1px solid #6b4b2c;background:#2b2115;color:#ffd99b;border-radius:9px;margin-bottom:16px}.banner.error{border-color:#68323a;background:#2a171d;color:#ffb3ba}.section{margin-top:22px}.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 9px}.headers,.body{margin:0;border:1px solid var(--line);border-radius:9px;background:#0b111d;padding:13px 14px;overflow:auto;font:12px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:320px}.headers .redacted{color:var(--amber)}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.pill{font:700 11px var(--mono);padding:4px 7px;border-radius:999px;background:#26344d;color:#bcd0f2}.pill.replay{background:#3f2d56;color:#e5c8ff}.notice{padding:0 14px 14px;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;padding:11px 14px;border-radius:9px;background:#e8f8f1;color:#10241c;box-shadow:0 10px 40px #0008;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:800px){body{overflow:auto}.shell{height:auto;min-height:100vh}.top{flex-wrap:wrap}.search{order:3;flex-basis:100%;max-width:none}.main{display:block}.list{border-right:0;max-height:45vh}.detail{min-height:55vh}.split{grid-template-columns:1fr}.row{grid-template-columns:58px minmax(0,1fr) 45px 58px}.capture span{display:none}}
  </style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><i>cf</i>dev inspector</div>
    <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Connecting…</span></div>
    <input id="search" class="search" placeholder="Filter method, path, hostname, or status" aria-label="Filter requests">
    <label class="capture"><input id="capture" type="checkbox"><span>Capture bodies (future requests)</span></label>
    <button id="clear" class="ghost">Clear</button>
  </header>
  <main class="main">
    <section class="list">
      <div id="limits" class="limits">Showing last 200 requests · bodies capped at 1 MiB · 32 MiB memory</div>
      <div id="rows"></div>
      <div id="listNotice" class="notice"></div>
    </section>
    <section id="detail" class="detail"><div class="empty"><div><h2>No traffic yet</h2><p>Requests through your cfdev URLs will appear here.</p></div></div></section>
  </main>
</div>
<div id="toast" class="toast" role="status"></div>
<script>
const state={items:[],selected:null,filter:'',service:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytes=n=>n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(1)} KiB`:`${(n/1048576).toFixed(1)} MiB`;
const duration=n=>n<1000?`${Math.round(n)} ms`:`${(n/1000).toFixed(2)} s`;
const time=s=>new Date(s).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
async function api(path,options){const response=await fetch(path,options);if(!response.ok){let message=await response.text();try{message=JSON.parse(message).error||message}catch{}throw new Error(message)}return response.json()}
function toast(message){$('toast').textContent=message;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function renderRows(){const q=state.filter.toLowerCase();const items=state.items.filter(x=>`${x.method} ${x.path} ${x.hostname} ${x.status}`.toLowerCase().includes(q));$('rows').innerHTML=items.map(x=>`<div class="row ${x.id===state.selected?'active':''}" data-id="${x.id}"><span class="method ${esc(x.method)}">${esc(x.method)}</span><span class="path"><strong>${esc(x.path)}</strong><small>${esc(x.hostname)} → ${esc(x.target.replace('127.0.0.1','localhost'))}${x.replay_of?' · replay':''}</small></span><span class="code ${x.status>=400?'bad':''}">${x.status||'—'}</span><span class="time">${duration(x.duration_ms)}</span></div>`).join('');$('listNotice').textContent=items.length?'':state.items.length?'No requests match this filter.':'';document.querySelectorAll('.row').forEach(row=>row.onclick=()=>select(Number(row.dataset.id)))}
function emptyState(){const service=state.service;if(!service)return['Connecting…','Waiting for the local inspector.'];if(!service.tunnel_running)return['Tunnel is down','Run cfdev up to start receiving public traffic.'];const stopped=(service.mappings||[]).filter(x=>!x.listening);if(stopped.length===service.mappings.length&&stopped.length)return['Local app is not listening',`${stopped[0].target.replace('127.0.0.1','localhost')} is not accepting connections.`];return['No traffic yet','Requests through your cfdev URLs will appear here.']}
function renderEmpty(){if(state.selected)return;const [title,copy]=emptyState();$('detail').innerHTML=`<div class="empty"><div><h2>${esc(title)}</h2><p>${esc(copy)}</p></div></div>`}
function headerText(headers){const lines=[];Object.keys(headers||{}).sort().forEach(name=>(headers[name]||[]).forEach(value=>lines.push(`${name}: ${value}`)));return lines.join('\n')||'None'}
function bodyText(body){if(!body.captured){if(body.skipped==='streaming')return 'Not captured (streaming or upgraded connection).';return 'Not captured. Enable body capture for future requests.'}if(body.binary)return `[binary body · base64]\n${body.base64}`;let value=body.text||'';try{return JSON.stringify(JSON.parse(value),null,2)}catch{return value||'(empty body)'}}
function bodyLabel(body){let label=`${bytes(body.size)}`;if(body.truncated)label+=' · truncated';if(body.incomplete)label+=' · incomplete';return label}
async function select(id){state.selected=id;renderRows();$('detail').innerHTML='<div class="empty">Loading request…</div>';try{const x=await api(`/api/requests/${id}`);const banners=[];if(x.local_down)banners.push('<div class="banner error">The local app was not accepting connections for this request.</div>');if(x.streaming)banners.push('<div class="banner">This was a streaming or upgraded connection. Metadata is available, but bodies and replay are disabled.</div>');if(x.request_body.truncated||x.response_body.truncated)banners.push('<div class="banner">A body exceeded 1 MiB. The captured prefix is inspectable, but exact replay is disabled.</div>');if(x.request_body.incomplete||x.response_body.incomplete)banners.push('<div class="banner error">The connection ended before the complete body was read. The partial body is inspectable, but replay is disabled.</div>');$('detail').innerHTML=`<div class="detail-head"><div><div><span class="pill">${esc(x.method)}</span> ${x.replay_of?`<span class="pill replay">Replay of #${x.replay_of}</span>`:''}</div><h1>${esc(x.path)}</h1><p>${esc(x.hostname)} → ${esc(x.target.replace('127.0.0.1','localhost'))} · ${x.status} · ${duration(x.duration_ms)}</p></div><div class="actions"><button id="copyCurl" class="ghost" ${x.curl_available?'':'disabled'}>Copy as curl</button><button id="replay" class="primary" ${x.replayable?'':'disabled'}>Replay to localhost</button></div></div>${banners.join('')}<div class="split"><div class="section"><h3>Request headers</h3><pre class="headers">${esc(headerText(x.request_headers))}</pre></div><div class="section"><h3>Response headers</h3><pre class="headers">${esc(headerText(x.response_headers))}</pre></div></div><div class="split"><div class="section"><h3>Request body · ${bodyLabel(x.request_body)}</h3><pre class="body">${esc(bodyText(x.request_body))}</pre></div><div class="section"><h3>Response body · ${bodyLabel(x.response_body)}</h3><pre class="body">${esc(bodyText(x.response_body))}</pre></div></div>`;if(x.curl_available)$('copyCurl').onclick=async()=>{await navigator.clipboard.writeText(x.curl);toast('curl copied')};if(x.replayable)$('replay').onclick=async()=>{const button=$('replay');button.disabled=true;button.textContent='Replaying…';try{const result=await api(`/api/requests/${id}/replay`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});toast('Replayed to localhost');await poll();await select(result.request.id)}catch(error){toast(error.message)}finally{button.disabled=false;button.textContent='Replay to localhost'}}}catch(error){state.selected=null;$('detail').innerHTML=`<div class="empty"><div><h2>Request unavailable</h2><p>${esc(error.message)}</p></div></div>`}}
async function poll(){try{const [items,service]=await Promise.all([api('/api/requests'),api('/api/state')]);state.items=items;state.service=service;$('capture').checked=service.capture_bodies;$('statusDot').classList.toggle('down',!service.tunnel_running);$('statusText').textContent=service.tunnel_running?'Tunnel running':'Tunnel down';const limits=service.limits;$('limits').textContent=`Showing last ${limits.requests} requests · bodies capped at ${bytes(limits.body_bytes)} · ${bytes(limits.memory_bytes)} memory · using ${bytes(service.memory_bytes||0)}`;if(state.selected&&!items.some(x=>x.id===state.selected))state.selected=null;renderRows();renderEmpty()}catch{$('statusDot').classList.add('down');$('statusText').textContent='Inspector disconnected'}}
$('search').oninput=event=>{state.filter=event.target.value;renderRows()};$('capture').onchange=async event=>{try{const result=await api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({capture_bodies:event.target.checked})});toast(result.capture_bodies?'Body capture enabled for future requests':'Body capture disabled')}catch(error){event.target.checked=!event.target.checked;toast(error.message)}};$('clear').onclick=async()=>{await api('/api/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});state.selected=null;await poll();toast('History cleared')};poll();setInterval(poll,1000);
</script>
</body>
</html>
